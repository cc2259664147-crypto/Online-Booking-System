<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预约大厅</title>
</head>

<body>
    <form action="#" method="post">
        <label for="name">姓名:</label>
        <input type="text" id="name" name="name" placeholder="请输入您的姓名" required><br><br>

        <label for="gender">性别:</label>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">男</label>
        <input type="radio" id="female" name="gender" value="female" required>
        <label for="female">女</label>
         <input type="radio" id="else" name="gender" value="else" required>
        <label for="else">其他</label><br><br>

        <label for="age">年龄:</label>
        <input type="number" id="age" name="age" placeholder="请输入您的年龄" required><br><br>

        <label for="telephone">电话:</label>
        <input type="telephone" id="telephone" name="telephone" placeholder="请输入您的电话号码" required><br><br>

        <label for="date">预约日期:</label>
        <input type="date" id="date" name="date" required><br><br>

        <label for="time">预约时间:</label>
        <input type="time" id="time" name="time" required><br><br>

        <input type="submit" value="确定预约">

    </form>
</body>

</html>
