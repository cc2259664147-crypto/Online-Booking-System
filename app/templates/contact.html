<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <title>意见反馈</title>
    </head>
    <style>
        body {
            background: linear-gradient(135deg, #0d99fde2, #4dabf7);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
    <body>
        <div class="container mt-5">
            <h1 class="mb-4">意见反馈</h1>
            {% if submitted %}
            <div class="alert alert-success">感谢您的反馈，我们已收到！</div>
            <a href="/home" class="btn btn-primary">返回主页</a>
            {% else %}
            <form method="post" action="/feedback">
                <div class="mb-3">
                    <label for="message" class="form-label">反馈内容</label>
                    <textarea class="form-control" id="message" name="message" rows="5" placeholder="请指出我们的问题" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">提交反馈</button>
            </form>
            {% endif %}
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</html>
