<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>登录</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<main class="flex-grow-1">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand fw-bold" href="https://www.bilibili.com/video/BV1xsRSBQENA/?spm_id_from=333.337.search-card.all.click&vd_source=96780bb473dbf29756b020543bc2ff91" target="_blank">奶龙</a>
    <div>
      <a class="nav-link d-inline text-white mx-2" href="/about">帮助</a>
      <a class="nav-link d-inline text-white mx-2" href="/contact">反馈</a>
    </div>
  </div>
</nav>

<section class="bg-primary text-white text-center py-5">
  <div class="container">
    <h1 style="font-size:48px; color:rgba(255, 255, 255, 0.801); font-weight:bold;">登录</h1>
  </div>
</section>

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="mb-3">
  <label class="form-label"><b>用户名或手机号</b></label>
  <input type="text" class="form-control" id="loginName" placeholder="请输入用户名或手机号">
</div>

<div class="mb-3">
  <label class="form-label"><b>密码</b></label>
  <input type="password" class="form-control" id="loginPassword" placeholder="请输入密码">
</div>

<div class="text-center">
  <button type="button" class="btn btn-primary" onclick="login()">登录</button>
</div>

<p class="text-center mt-3">
  没有账号？<a href="/register">去注册</a>
</p>

<script>
async function login() {
  const loginName = document.getElementById("loginName").value.trim();
  const loginPassword = document.getElementById("loginPassword").value.trim();

  if (!loginName || !loginPassword) {
    alert("请输入用户名和密码");
    return;
  }

  try {
    const res = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: loginName, password: loginPassword })
    });

    const data = await res.json();

    if (!res.ok) {
      alert(data.error || "登录失败");
      return;
    }

    localStorage.setItem("isLogin", "true");
    localStorage.setItem("currentUser", JSON.stringify(data.data));
    localStorage.setItem("userId", data.data.id);
    alert(data.message || "登录成功");
    location.href = "/home";
  } catch (err) {
    console.error(err);
    alert("登录失败，请检查后端是否启动");
  }
}
</script>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</main>
<footer class="bg-dark text-white text-center py-3">
  <i>奶龙无限缺德集团</i>
</footer>

</body>
</html>
