<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>更多</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<style>
  body{
    background: linear-gradient(135deg,hwb(197 57% 11% / 0.925),#cddce8);
  }
</style>

<body class="d-flex flex-column min-vh-100">
<div class="d-flex justify-content-center gap-3 my-4">
  <button type="button" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#diseaseModal">
    有关疾病
  </button>

  <button type="button" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#facilityModal">
    有关医疗设备
  </button>
</div>
<div class="d-flex justify-content-center gap-3 my-4">
  <a href="/home" class="btn btn-primary">返回主页</a>
</div>

  <!-- 疾病弹窗 -->
  <div class="modal fade" id="diseaseModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">疾病详情</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <div id="diseaseButtons" class="mb-3"></div>

          <div id="diseaseContent" class="border p-3 rounded mt-3">
            请选择一种疾病
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-danger" data-bs-dismiss="modal">关闭</button>
        </div>

      </div>
    </div>
  </div>

  <!-- 医疗设备弹窗 -->
  <div class="modal fade" id="facilityModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">医疗设备详情</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <div id="facilityButtons" class="mb-3"></div>

          <div id="facilityContent" class="border p-3 rounded mt-3">
            请选择一种医疗设备
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-danger" data-bs-dismiss="modal">关闭</button>
        </div>

      </div>
    </div>
  </div>

  <script>
    let diseases = {};
    let facilities = {};

    fetch("/static/data.json")
      .then(response => response.json())
      .then(data => {
        diseases = data.diseases;
        facilities = data.facilities;

        renderButtons(diseases, "diseaseButtons", "disease");
        renderButtons(facilities, "facilityButtons", "facility");
      });

    function renderButtons(data, containerId, type) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";

      for (let name in data) {
        const button = document.createElement("button");

        button.innerText = name;
        button.className = type === "disease"
          ? "btn btn-primary me-2 mb-2"
          : "btn btn-success me-2 mb-2";

        button.onclick = function () {
          if (type === "disease") {
            showDisease(name);
          } else {
            showFacility(name);
          }
        };

        container.appendChild(button);
      }
    }

function showDisease(name) {
  const d = diseases[name];

  document.getElementById("diseaseContent").innerHTML = `
    <h5>${name}</h5>
    <p><strong>简介：</strong>${d.desc}</p>
    <p><strong>症状：</strong>${d.symptoms}</p>
    <p><strong>建议：</strong>${d.advice}</p>
  `;
}

function showFacility(name) {
  const f = facilities[name];

  document.getElementById("facilityContent").innerHTML = `
    <h5>${name}</h5>
    <p><strong>简介：</strong>${f.desc}</p>
    <p><strong>使用方法：</strong>${f.usage}</p>
    <p><strong>注意事项：</strong>${f.note}</p>
  `;
}
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
