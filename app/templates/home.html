<!-- 用户评价区 -->
<div class="container my-5">
  <h3 class="text-center mb-3">用户评价</h3>

  <div id="reviewList" class="mb-4"></div>

  <div class="text-center mb-2">
    <button id="showReviewFormBtn" class="btn btn-outline-primary" type="button"
            data-bs-toggle="collapse" data-bs-target="#reviewFormBox">
      写评价
    </button>
  </div>

  <div class="collapse" id="reviewFormBox">
    <div class="card card-body mx-auto" style="max-width:500px;">
      <div class="mb-2">
        <label class="form-label">评分</label>
        <select id="reviewRating" class="form-select">
          <option value="5">⭐⭐⭐⭐⭐ 非常好</option>
          <option value="4">⭐⭐⭐⭐ 好</option>
          <option value="3">⭐⭐⭐ 一般</option>
          <option value="2">⭐⭐ 差</option>
          <option value="1">⭐ 非常差</option>
        </select>
      </div>
      <div class="mb-2">
        <textarea id="reviewComment" class="form-control" rows="3"
                  placeholder="分享您的体验..."></textarea>
      </div>
      <button id="submitReviewBtn" class="btn btn-success" onclick="submitReview()">提交评价</button>
    </div>
  </div>
</div>

</main>
<footer class="bg-dark text-white text-center py-3">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
window.onload = function () {
  const isLogin = localStorage.getItem("isLogin");
  const user = JSON.parse(localStorage.getItem("currentUser"));

  if (isLogin === "true" && user) {
    document.getElementById("userInfo").innerText = "欢迎，" + user.username;
    document.getElementById("loginLink").style.display = "none";
    document.getElementById("logoutLink").style.display = "inline";
  }

  loadReviews();
};

function logout() {
  localStorage.removeItem("isLogin");
  localStorage.removeItem("currentUser");
  localStorage.removeItem("userId");
  alert("已退出登录");
  location.reload();
}

async function loadReviews() {
  const list = document.getElementById("reviewList");
  list.innerHTML = "<p class='text-muted text-center'>加载中...</p>";

  try {
    const res = await fetch("/api/reviews");
    const data = await res.json();
    const reviews = data.data || [];

    if (reviews.length === 0) {
      list.innerHTML = "<p class='text-muted text-center'>暂无评价，快来写第一条吧</p>";
      return;
    }

    list.innerHTML = reviews.map(r => `
      <div class="border rounded p-3 mb-2 bg-light">
        <div class="d-flex justify-content-between">
          <strong>${escapeHtml(r.username || "匿名")}</strong>
          <small class="text-muted">${formatDate(r.createdAt)}</small>
        </div>
        <div class="my-1">${renderStars(r.rating)}</div>
        <p class="mb-0">${escapeHtml(r.comment || "(无内容)")}</p>
      </div>
    `).join("");
  } catch (err) {
    console.error(err);
    list.innerHTML = "<p class='text-danger text-center'>加载评价失败</p>";
  }
}

async function submitReview() {
  const userId = localStorage.getItem("userId");
  if (!userId) {
    alert("请先登录后再评价");
    location.href = "/login";
    return;
  }

  const rating = parseInt(document.getElementById("reviewRating").value);
  const comment = document.getElementById("reviewComment").value.trim();
  if (!comment) {
    alert("请输入评价内容");
    return;
  }

  try {
    // Find the "综合评价" service ID
    const res = await fetch("/api/services");
    const data = await res.json();
    const general = (data.data || []).find(s => s.name === "综合评价");
    if (!general) {
      alert("评价服务暂不可用，请稍后再试");
      return;
    }

    const resp = await fetch("/api/reviews", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-User-Id": userId
      },
      body: JSON.stringify({
        serviceId: general.id,
        rating: rating,
        comment: comment
      })
    });

    const result = await resp.json();
    if (!resp.ok) {
      alert(result.error || "提交失败");
      return;
    }

    alert(result.message || "评价成功");
    document.getElementById("reviewComment").value = "";
    document.getElementById("reviewFormBox").classList.remove("show");
    loadReviews();
  } catch (err) {
    console.error(err);
    alert("提交失败，请检查网络");
  }
}

function renderStars(rating) {
  if (!rating) return "未评分";
  const full = "★".repeat(rating);
  const empty = "☆".repeat(5 - rating);
  return `<span style="color:#f0ad4e;">${full}${empty}</span>`;
}

function formatDate(isoStr) {
  if (!isoStr) return "";
  const d = new Date(isoStr);
  if (isNaN(d.getTime())) return isoStr;
  return d.toLocaleString("zh-CN");
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
</script>
