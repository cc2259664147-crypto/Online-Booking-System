<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的预约</title>

<style>
body {
    margin: 0;
    background: linear-gradient(135deg, #b2d3ec, #c4e7ed);
    min-height: 100vh;
    font-family: Arial, "Microsoft YaHei", sans-serif;
}

.container {
    width: 90%;
    max-width: 1000px;
    margin: 40px auto;
}

h1 {
    text-align: center;
    color: #0d6efd;
}

.result-box {
    background: rgba(255,255,255,0.94);
    padding: 25px;
    border-radius: 14px;
    margin-top: 25px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.12);
}

.card {
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 15px;
    background: white;
}

button {
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    color: white;
    margin-top: 10px;
}

.refresh-btn {
    background: #0d6efd;
}

.cancel-btn {
    background: #dc3545;
}

.back-btn {
    background: #6c757d;
}

.status {
    font-weight: bold;
}

.BOOKED {
    color: #fd7e14;
}

.COMPLETED {
    color: #0d6efd;
}

.CANCELLED {
    color: #dc3545;
}

.empty {
    text-align: center;
    color: #666;
}
</style>
</head>

<body>

<div class="container">

    <h1>我的预约</h1>

    <div class="result-box">
        <button class="refresh-btn" onclick="loadAppointments()">刷新预约</button>
        <button class="back-btn" onclick="location.href='/home'">返回主页</button>

        <hr>

        <div id="appointmentList" class="empty">正在加载预约记录...</div>
    </div>

</div>

<script>
window.onload = function () {
    checkLogin();
    loadAppointments();
};

function checkLogin() {
    const userId = localStorage.getItem("userId");

    if (!userId) {
        alert("请先登录后查看预约");
        location.href = "/login";
    }
}

function loadAppointments() {
    const userId = localStorage.getItem("userId");
    const list = document.getElementById("appointmentList");

    list.innerHTML = "加载中...";

    fetch("/api/appointments/user", {
        method: "GET",
        headers: {
            "X-User-Id": userId
        }
    })
    .then(res => res.json())
    .then(data => {
        if (data.error) {
            list.innerHTML = `<p class="empty">${data.error}</p>`;
            return;
        }

        const appointments = data.data || [];

        if (appointments.length === 0) {
            list.innerHTML = `<p class="empty">暂无预约记录</p>`;
            return;
        }

        list.innerHTML = "";

        appointments.forEach(item => {
            const card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
                <h3>${item.serviceName || "预约服务"}</h3>
                <p><b>患者：</b>${item.patientName || "暂无"}</p>
                <p><b>预约时间：</b>${formatTime(item.appointmentTime)}</p>
                <p><b>状态：</b>
                    <span class="status ${item.status}">
                        ${translateStatus(item.status)}
                    </span>
                </p>
                <p><b>备注：</b>${item.note || "无"}</p>
                ${
                    item.status === "BOOKED"
                    ? `<button class="cancel-btn" onclick="cancelAppointment(${item.id})">取消预约</button>`
                    : ""
                }
            `;

            list.appendChild(card);
        });
    })
    .catch(err => {
        console.error(err);
        list.innerHTML = `<p class="empty">加载失败，请检查后端是否启动</p>`;
    });
}

function cancelAppointment(id) {
    const userId = localStorage.getItem("userId");

    if (!confirm("确定要取消这个预约吗？")) {
        return;
    }

    fetch(`/api/appointments/${id}/cancel`, {
        method: "POST",
        headers: {
            "X-User-Id": userId
        }
    })
    .then(res => res.json())
    .then(data => {
        if (data.error) {
            alert(data.error);
        } else {
            alert(data.message || "预约已取消");
            loadAppointments();
        }
    })
    .catch(err => {
        console.error(err);
        alert("取消失败，请检查后端是否启动");
    });
}

function translateStatus(status) {
    const map = {
        BOOKED: "已预约",
        CANCELLED: "已取消",
        COMPLETED: "已完成"
    };
    return map[status] || status;
}

function formatTime(timeStr) {
    if (!timeStr) return "暂无时间";

    const date = new Date(timeStr);

    if (isNaN(date.getTime())) {
        return timeStr;
    }

    return date.toLocaleString("zh-CN", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
    });
}
</script>

</body>
</html>
