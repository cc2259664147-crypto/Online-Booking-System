<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title>意见反馈</title>

<style>
body {
  background: linear-gradient(135deg, #0d99fde2, #4dabf7);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container-box {
  width: 90%;
  max-width: 700px;
  background-color: rgba(255, 255, 255, 0.94);
  padding: 30px;
  border-radius: 10px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<div class="container-box">
  <h1 class="mb-4 text-primary">意见反馈</h1>

  <div class="mb-3">
    <label class="form-label">选择服务</label>
    <select id="serviceSelect" class="form-select">
      <option value="">加载中...</option>
    </select>
  </div>

  <div class="mb-3">
    <label for="message" class="form-label">反馈内容</label>
    <textarea class="form-control" id="message" rows="5" placeholder="请填写反馈内容" required></textarea>
  </div>

  <button type="button" class="btn btn-primary" onclick="submitComplaint()">提交反馈</button>
  <a href="/home" class="btn btn-secondary">返回首页</a>
</div>

<script>
const API_BASE = "http://127.0.0.1:5000";

window.onload = function () {
  const user = JSON.parse(localStorage.getItem("currentUser"));

  if (!user) {
    alert("请先登录后再提交反馈");
    location.href = "/login";
    return;
  }

  loadServices();
};

function loadServices() {
  fetch(`${API_BASE}/api/services`)
    .then(res => res.json())
    .then(data => {
      const select = document.getElementById("serviceSelect");
      select.innerHTML = "";

      if (data.error) {
        select.innerHTML = `<option value="">加载失败</option>`;
        alert(data.error);
        return;
      }

      const services = data.data || [];

      if (services.length === 0) {
        select.innerHTML = `<option value="">暂无服务</option>`;
        return;
      }

      services.forEach(service => {
        const option = document.createElement("option");
        option.value = service.id;
        option.innerText = `${service.category || "其他"} - ${service.name}`;
        select.appendChild(option);
      });
    })
    .catch(err => {
      console.error(err);
      alert("服务列表加载失败");
    });
}

function submitComplaint() {
  const user = JSON.parse(localStorage.getItem("currentUser"));
  const serviceId = document.getElementById("serviceSelect").value;
  const content = document.getElementById("message").value.trim();

  if (!user) {
    alert("请先登录");
    location.href = "/login";
    return;
  }

  if (!serviceId) {
    alert("请选择服务");
    return;
  }

  if (!content) {
    alert("请输入反馈内容");
    return;
  }

  fetch(`${API_BASE}/api/complaints`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-User-Id": user.id
    },
    body: JSON.stringify({
      serviceId: Number(serviceId),
      content: content
    })
  })
  .then(res => res.json())
  .then(data => {
    if (data.error) {
      alert(data.error);
    } else {
      alert(data.message || "反馈提交成功");
      document.getElementById("message").value = "";
    }
  })
  .catch(err => {
    console.error(err);
    alert("提交失败，请检查后端是否启动");
  });
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
