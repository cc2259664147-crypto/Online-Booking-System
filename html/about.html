<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帮助</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
  background: linear-gradient(135deg, #e3f2fd, #ffffff);
  min-height: 100vh;
}

.help-box {
  max-width: 900px;
  margin: 50px auto;
  background: white;
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.1);
}

h1 {
  color: #0d6efd;
  font-weight: bold;
  text-align: center;
  margin-bottom: 30px;
}
</style>
</head>

<body>

<div class="container">
  <div class="help-box">
    <h1>更多帮助</h1>

    <div class="accordion" id="helpAccordion">

      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#help1">
            1. 无法预约怎么办？
          </button>
        </h2>
        <div id="help1" class="accordion-collapse collapse show" data-bs-parent="#helpAccordion">
          <div class="accordion-body">
            请先确认已经登录，然后选择科室、项目、预约日期和预约时间。如果仍无法提交，请检查后端服务是否启动。
          </div>
        </div>
      </div>

      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#help2">
            2. 想修改预约怎么办？
          </button>
        </h2>
        <div id="help2" class="accordion-collapse collapse" data-bs-parent="#helpAccordion">
          <div class="accordion-body">
            当前系统支持查看和取消预约。修改预约可以先取消原预约，再重新提交新的预约。
          </div>
        </div>
      </div>

      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#help3">
            3. 想取消预约怎么办？
          </button>
        </h2>
        <div id="help3" class="accordion-collapse collapse" data-bs-parent="#helpAccordion">
          <div class="accordion-body">
            请进入“我的预约”页面，找到对应预约记录，点击“取消预约”按钮即可。
          </div>
        </div>
      </div>

      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#help4">
            4. 忘记预约时间怎么办？
          </button>
        </h2>
        <div id="help4" class="accordion-collapse collapse" data-bs-parent="#helpAccordion">
          <div class="accordion-body">
            登录后进入“我的预约”，可以查看当前账号下的所有预约记录。
          </div>
        </div>
      </div>

      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#help5">
            5. 预约需要登录吗？
          </button>
        </h2>
        <div id="help5" class="accordion-collapse collapse" data-bs-parent="#helpAccordion">
          <div class="accordion-body">
            需要。系统会根据当前登录用户记录预约信息。
          </div>
        </div>
      </div>

    </div>

    <div class="text-center mt-4">
      <a href="/home" class="btn btn-primary">返回主页</a>
      <a href="/booking-page" class="btn btn-success">前往预约大厅</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
