<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>注册</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
  <div class="col-md-5 mx-auto card p-4 shadow">
    <h2 class="text-center text-primary mb-4">用户注册</h2>

    <input id="username" class="form-control mb-3" placeholder="请输入用户名">
    <input id="phone" class="form-control mb-3" placeholder="请输入手机号">
    <input id="password" type="password" class="form-control mb-3" placeholder="请输入密码">

    <button class="btn btn-primary w-100" onclick="register()">注册</button>

    <p class="text-center mt-3">
      已有账号？<a href="log_in.html">去登录</a>
    </p>
  </div>
</div>

<script>
function register() {
  const username = document.getElementById("username").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!username || !phone || !password) {
    alert("请填写完整信息");
    return;
  }

  const user = {
    username,
    phone,
    password
  };

  localStorage.setItem("user", JSON.stringify(user));

  alert("注册成功，请登录");
  location.href = "log_in.html";
}
</script>

</body>
</html>
