<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的预约</title>

<style>
body {
  margin: 0;
  background: linear-gradient(135deg, #b2d3ec, #c4e7ed);
  min-height: 100vh;
  font-family: Arial, "Microsoft YaHei", sans-serif;
}

.container {
  width: 90%;
  max-width: 1000px;
  margin: 40px auto;
}

h1 {
  text-align: center;
  color: #0d6efd;
}

.search-box,
.result-box {
  background: rgba(255,255,255,0.94);
  padding: 25px;
  border-radius: 14px;
  margin-top: 25px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.12);
}

button {
  border: none;
  padding: 10px 18px;
  border-radius: 8px;
  cursor: pointer;
  color: white;
  margin-top: 15px;
}

.search-btn {
  background: #0d6efd;
}

.cancel-btn {
  background: #dc3545;
}

.back-btn {
  background: #6c757d;
}

.card {
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 15px;
  background: white;
}

.status {
  font-weight: bold;
}

.booked {
  color: #198754;
}

.cancelled {
  color: #dc3545;
}

.completed {
  color: #0d6efd;
}

.empty {
  text-align: center;
  color: #666;
}
</style>
</head>

<body>

<div class="container">

  <h1>我的预约</h1>

  <div class="search-box">
    <p><b>当前登录用户的预约记录：</b></p>
    <button class="search-btn" onclick="searchAppointments()">刷新预约</button>
    <button class="back-btn" onclick="location.href='/home'">返回主页</button>
  </div>

  <div class="result-box">
    <h2>预约记录</h2>
    <div id="appointmentList" class="empty">加载中...</div>
  </div>

</div>

<script>
const API_BASE = "http://127.0.0.1:5000";

window.onload = function () {
  const user = JSON.parse(localStorage.getItem("currentUser"));

  if (!user) {
    alert("请先登录");
    location.href = "/login";
    return;
  }

  searchAppointments();
};

function searchAppointments() {
  const user = JSON.parse(localStorage.getItem("currentUser"));
  const list = document.getElementById("appointmentList");

  if (!user) {
    alert("请先登录");
    location.href = "/login";
    return;
  }

  list.innerHTML = "查询中...";

  fetch(`${API_BASE}/api/appointments/user`, {
    method: "GET",
    headers: {
      "X-User-Id": user.id
    }
  })
  .then(res => res.json())
  .then(data => {
    const appointments = data.data || [];

    if (data.error) {
      alert(data.error);
      return;
    }

    if (appointments.length === 0) {
      list.innerHTML = `<p class="empty">暂无预约记录</p>`;
      return;
    }

    list.innerHTML = "";

    appointments.forEach(item => {
      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <h3>${item.serviceName || "未知服务"}</h3>
        <p><b>患者姓名：</b>${item.patientName || ""}</p>
        <p><b>性别：</b>${item.gender || ""}</p>
        <p><b>年龄：</b>${item.age || ""}</p>
        <p><b>电话：</b>${item.phone || ""}</p>
        <p><b>预约时间：</b>${formatTime(item.appointmentTime)}</p>
        <p><b>备注：</b>${item.note || "无"}</p>
        <p><b>状态：</b>
          <span class="status ${String(item.status).toLowerCase()}">
            ${translateStatus(item.status)}
          </span>
        </p>
        ${
          item.status === "BOOKED"
          ? `<button class="cancel-btn" onclick="cancelAppointment(${item.id})">取消预约</button>`
          : ""
        }
      `;

      list.appendChild(card);
    });
  })
  .catch(err => {
    console.error(err);
    list.innerHTML = `<p class="empty">查询失败，请检查后端是否启动</p>`;
  });
}

function cancelAppointment(id) {
  const user = JSON.parse(localStorage.getItem("currentUser"));

  if (!confirm("确定要取消这个预约吗？")) {
    return;
  }

  fetch(`${API_BASE}/api/appointments/${id}/cancel`, {
    method: "POST",
    headers: {
      "X-User-Id": user.id
    }
  })
  .then(res => res.json())
  .then(data => {
    if (data.error) {
      alert(data.error);
    } else {
      alert(data.message || "预约已取消");
      searchAppointments();
    }
  })
  .catch(err => {
    console.error(err);
    alert("取消失败，请检查后端是否启动");
  });
}

function translateStatus(status) {
  const map = {
    BOOKED: "已预约",
    CANCELLED: "已取消",
    COMPLETED: "已完成"
  };

  return map[status] || status;
}

function formatTime(timeStr) {
  if (!timeStr) return "暂无时间";

  const date = new Date(timeStr);

  if (isNaN(date.getTime())) {
    return timeStr;
  }

  return date.toLocaleString("zh-CN", {
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit"
  });
}
</script>

</body>
</html>
