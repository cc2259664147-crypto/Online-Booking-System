<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的预约</title>

<style>
body {
    margin: 0;
    background: linear-gradient(135deg, #b2d3ec, #c4e7ed);
    min-height: 100vh;
    font-family: Arial, "Microsoft YaHei", sans-serif;
}

.container {
    width: 90%;
    max-width: 1000px;
    margin: 40px auto;
}

h1 {
    text-align: center;
    color: #0d6efd;
}

.search-box,
.result-box {
    background: rgba(255,255,255,0.94);
    padding: 25px;
    border-radius: 14px;
    margin-top: 25px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.12);
}

input {
    width: 100%;
    padding: 10px;
    box-sizing: border-box;
    margin-top: 8px;
}

button {
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    color: white;
    margin-top: 15px;
}

.search-btn {
    background: #0d6efd;
}

.cancel-btn {
    background: #dc3545;
}

.back-btn {
    background: #6c757d;
}

.card {
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 15px;
    background: white;
}

.status {
    font-weight: bold;
}

.pending {
    color: #fd7e14;
}

.confirmed {
    color: #198754;
}

.cancelled {
    color: #dc3545;
}

.completed {
    color: #0d6efd;
}

.empty {
    text-align: center;
    color: #666;
}
</style>
</head>

<body>

<div class="container">

    <h1>我的预约</h1>

    <div class="search-box">
        <label for="telephone"><b>请输入手机号查询预约：</b></label>
        <input type="tel" id="telephone" placeholder="请输入预约时填写的手机号">

        <button class="search-btn" onclick="searchAppointments()">查询预约</button>
        <button class="back-btn" onclick="location.href='home.html'">返回主页</button>
    </div>

    <div class="result-box">
        <h2>预约记录</h2>
        <div id="appointmentList" class="empty">暂无查询结果</div>
    </div>

</div>

<script>
function searchAppointments() {
    const telephone = document.getElementById("telephone").value.trim();
    const list = document.getElementById("appointmentList");

    if (!telephone) {
        alert("请输入手机号");
        return;
    }

    list.innerHTML = "查询中...";

    fetch(`http://127.0.0.1:5000/api/appointments?telephone=${telephone}`)
        .then(res => res.json())
        .then(data => {
            const appointments = data.data || [];
            if(appointments.length == 0){
                list.innerHTML = `<p class="empty">暂无预约记录</p>`;
                return;
            }

            list.innerHTML = "";

            appointments.forEach(item => {
                const card = document.createElement("div");
                card.className = "card";

                card.innerHTML = `
                    <h3>${item.department} - ${item.project}</h3>
                    <p><b>姓名：</b>${item.name || ""}</p>
                    <p><b>电话：</b>${item.telephone || ""}</p>
                    <p><b>预约时间：</b>${formatTime(item.start_time)}</p>
                    <p><b>备注：</b>${item.remark || "无"}</p>
                    <p><b>状态：</b>
                        <span class="status ${item.status}">
                            ${translateStatus(item.status)}
                        </span>
                    </p>
                    ${
                        item.status === "pending" || item.status === "confirmed"
                        ? `<button class="cancel-btn" onclick="cancelAppointment(${item.id})">取消预约</button>`
                        : ""
                    }
                `;

                list.appendChild(card);
            });
        })
        .catch(err => {
            console.error(err);
            list.innerHTML = `<p class="empty">查询失败，请检查后端是否启动</p>`;
        });
}

function cancelAppointment(id) {
    if (!confirm("确定要取消这个预约吗？")) {
        return;
    }

    fetch(`http://127.0.0.1:5000/api/appointments/${id}/cancel`, {
        method: "PUT"
    })
    .then(res => res.json())
    .then(data => {
        if (data.error) {
            alert(data.error);
        } else {
            alert(data.message || "预约已取消");
            searchAppointments();
        }
    })
    .catch(err => {
        console.error(err);
        alert("取消失败，请检查后端是否启动");
    });
}

function translateStatus(status) {
    const map = {
        pending: "待确认",
        confirmed: "已确认",
        completed: "已完成",
        cancelled: "已取消"
    };

    return map[status] || status;
}

function formatTime(timeStr) {
    if (!timeStr) return "暂无时间";

    const date = new Date(timeStr);

    if (isNaN(date.getTime())) {
        return timeStr;
    }

    return date.toLocaleString("zh-CN", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
    });
}
</script>

</body>
</html>
