<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>在线预约</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">
<main class="flex-grow-1">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand fw-bold text-warning" href="/home">在线预约系统</a>

    <div>
      <a class="nav-link d-inline text-white mx-2" href="/home">主页</a>
      <a class="nav-link d-inline text-white mx-2" href="/about">帮助</a>
      <a class="nav-link d-inline text-white mx-2" href="/contact">反馈</a>
      <a class="nav-link d-inline text-white mx-2" href="/more">更多</a>
      <a class="nav-link d-inline text-white mx-2" href="/my-booking">我的预约</a>
    </div>

    <div>
      <span id="userInfo" class="text-white mx-2"></span>
      <a id="loginLink" class="nav-link d-inline text-white mx-2" href="/login">登录</a>
      <a id="logoutLink" class="nav-link d-inline text-white mx-2" href="#" onclick="logout()" style="display:none;">退出</a>
    </div>
  </div>
</nav>

<style>
.my-btn {
  background: linear-gradient(135deg, #18ffc1, #a047ff);
  color: white;
  border-radius: 12px;
  padding: 12px 30px;
  font-weight: bold;
}
</style>

<section style="background: linear-gradient(135deg,#0d6efd,#4dabf7);" class="py-5">
  <div class="container text-center">
    <h1 class="display-4 fw-bold text-white">在线预约</h1>
    <p class="lead text-white"><b>在这里预约医疗服务</b></p>
  </div>
</section>

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-8 text-center">
      <h2>欢迎使用在线预约系统</h2>
      <a href="/booking-page" class="btn btn-lg mt-3 my-btn">预约大厅</a>
    </div>
  </div>
</div>

<div class="container my-5">
  <div class="row g-4">
    <div class="col-md-4">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h3 class="card-title">主页</h3>
          <p class="card-text">欢迎使用本系统进行医疗服务预约。</p>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h3 class="card-title">关于预约</h3>
          <p class="card-text">您可以在预约大厅选择医疗服务并提交预约。</p>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h3 class="card-title">反馈</h3>
          <p class="card-text">
            如有问题，请前往反馈页面提交意见。
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

</main>

<footer class="bg-dark text-white text-center py-3">
  <b><i>在线预约系统</i></b>
</footer>

<script>
window.onload = function () {
  const isLogin = localStorage.getItem("isLogin");
  const user = JSON.parse(localStorage.getItem("currentUser"));

  if (isLogin === "true" && user) {
    document.getElementById("userInfo").innerText = "欢迎，" + user.username;
    document.getElementById("loginLink").style.display = "none";
    document.getElementById("logoutLink").style.display = "inline";
  }
};

function logout() {
  localStorage.removeItem("isLogin");
  localStorage.removeItem("currentUser");
  alert("已退出登录");
  location.href = "/home";
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
