<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>在线预约</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 </head>

<body class="d-flex flex-column min-vh-100">

<main class="flex-grow-1">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a style="color:gold;font-size:36px;font-weight:bold;text-decoration:underline;" href="https://www.bilibili.com/video/BV1xsRSBQENA/?spm_id_from=333.337.search-card.all.click&vd_source=96780bb473dbf29756b020543bc2ff91" target="_blank">奶龙</a>
    <div>
      <a class="nav-link d-inline text-white mx-2" href="home.html">主页</a>
      <a class="nav-link d-inline text-white mx-2" href="about.html">帮助</a>
      <a class="nav-link d-inline text-white mx-2" href="contact.html">反馈</a>
      <a class="nav-link d-inline text-white mx-2" href="more.html">更多</a>
    </div>
  </div>
</nav>

<style>

.my-btn {
  background: linear-gradient(135deg, #18ffc1, #a047ff);
  color: rgba(255, 255, 255, 0.692);
  border-radius: 12px;
  padding: 12px 30px;
  font-weight: bold;
}

</style>
<section style="background: linear-gradient(135deg,#0d6efd,#4dabf7);">
  <div class="container">
    <h1 class="display-4 fw-bold text-white">在线预约</h1>
    <p class="lead"><b>在这里预约医疗服务</b></p>    
  </div>
</section>

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-8 text-center">
      <h2>欢迎使用在线预约系统</h2>
    </div>
  </div>
  <div class="row justify-content-center">
    <div class="col-md-8 text-center">
      <a href="booking.html" class="btn btn-lg mt-3 my-btn">预约大厅</a>
    </div>
  </div>
</div>

<div class="container my-5">
  <div class="row g-4">

    <div class="col-md-4" id="home">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h3 class="card-title">主页</h3>
          <p class="card-text">自己看吧，我也不知道该写什么</p>
        </div>
      </div>
    </div>

    <div class="col-md-4" id="about">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h3 class="card-title">关于预约</h3>
          <p class="card-text">您可以在预约大厅选择您需要的医疗服务。</p>
        </div>
      </div>
    </div>

    <div class="col-md-4" id="contact">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h3 class="card-title">反馈</h3>
          <p class="card-text">
            如果有问题，你可以通过以下方式联系我们： 
            <a href="mailto:2330832810@qq.com">2330832810@qq.com</a>
          </p>
        </div>
      </div>
    </div>

  </div>
</div>

<br>
<br>
<button class="btn btn-outline-primary" type="button"
        data-bs-toggle="collapse"
        data-bs-target="#commentBox">
  用户评价
</button>

<div class="collapse mt-3" id="commentBox">
  <div class="card card-body">

    <form method="post">

      <textarea name="content" class="form-control mb-2"
                placeholder="请输入评论" required></textarea>

      <button class="btn btn-success">提交评论</button>
    </form>

    <hr>

    {% for msg in messages %}
    <div class="border rounded p-3 mb-2">
      <strong>{{ msg[1] }}</strong>
      <p>{{ msg[3] }}</p>

      {% if msg[4] %}
      <div class="alert alert-success mb-0">
        商家回复：{{ msg[4] }}
      </div>
      {% else %}
      <p class="text-muted mb-0">商家暂未回复</p>
      {% endif %}
    </div>
    {% endfor %}

  </div>
</div>

</main>
<footer class="bg-dark text-white text-center py-3">
  <b><i>奶龙无限缺德集团</i></b>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
